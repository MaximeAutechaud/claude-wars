  <rect x="21" y="28" width="3.6" height="3.5" rx="1.2" fill="#6b7280" stroke="#333333" stroke-width="1"/>
  <rect x="14.8" y="30.8" width="4.6" height="2.8" rx="1.1" fill="#4a3524" stroke="#333333" stroke-width="1"/>
  <rect x="20.6" y="30.8" width="4.6" height="2.8" rx="1.1" fill="#4a3524" stroke="#333333" stroke-width="1"/>
  <!-- épée diagonale, main gantée -->
