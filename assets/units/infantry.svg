  <path d="M13 17.5 v-6.5 a7 7 0 0 1 14 0 v6.5 z" fill="#d7dce4" stroke="#333333" stroke-width="1.2"/>
  <path d="M23.6 4.9 q3.4 2.1 3.4 6.1 v6 h-3.4 z" fill="#b9c1cc"/>
  <rect x="13.5" y="10.2" width="13" height="2.8" fill="#262b31"/>
  <rect x="19.2" y="10.2" width="1.6" height="6.4" fill="#262b31"/>
  <circle cx="15.2" cy="15.9" r="0.5" fill="#8e98a6"/>
  <circle cx="20" cy="15.9" r="0.5" fill="#8e98a6"/>
  <circle cx="24.8" cy="15.9" r="0.5" fill="#8e98a6"/>
  <!-- épaulières -->
  <circle cx="13.2" cy="18.8" r="2.7" fill="#d7dce4" stroke="#333333" stroke-width="1"/>
  <circle cx="26.8" cy="18.8" r="2.7" fill="#d7dce4" stroke="#333333" stroke-width="1"/>
