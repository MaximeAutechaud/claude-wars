    <rect x="26.9" y="18.3" width="7" height="2" rx="0.9" fill="#b08d3e" stroke="#333333" stroke-width="0.8"/>
    <rect x="29.3" y="20.2" width="1.9" height="3" rx="0.8" fill="#66422a" stroke="#333333" stroke-width="0.7"/>
    <circle cx="30.3" cy="24.2" r="1.4" fill="#b08d3e" stroke="#333333" stroke-width="0.7"/>
  </g>
  <!-- tunique de faction : manche, corps, ourlet, ceinture -->
  <path d="M25 20 L29.8 20.8 L29.4 23 L24.8 22.2 z" fill="#e800e8" stroke="#333333" stroke-width="0.9"/>
  <circle cx="30.7" cy="21.7" r="1.9" fill="#8a5a33" stroke="#333333" stroke-width="0.9"/>
  <rect x="13" y="17.5" width="14" height="11.5" rx="3" fill="#e800e8" stroke="#333333" stroke-width="1.2"/>
  <rect x="13.3" y="26.4" width="13.4" height="2.4" fill="#a800a8"/>
  <rect x="13.2" y="23.6" width="13.6" height="2.1" fill="#66422a"/>
  <rect x="19" y="23.3" width="2.2" height="2.6" rx="0.5" fill="#c9a24b" stroke="#333333" stroke-width="0.7"/>
